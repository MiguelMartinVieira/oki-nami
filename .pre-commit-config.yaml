# .pre-commit-config.yaml — hooks que corren ANTES de cada commit.
#
# Setup (una sola vez por máquina):
#   pip install pre-commit
#   pre-commit install
#
# Forzar pase sobre TODO el repo (no solo staged):
#   pre-commit run --all-files
#
# Saltarse en un commit puntual (úsalo con cabeza):
#   git commit --no-verify -m "..."

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: "\\.csv$|\\.json$"
      - id: end-of-file-fixer
        exclude: "\\.csv$|\\.json$"
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        # 10 MB para permitir Background.png (8.1 MB) y logos
        args: ["--maxkb=10240"]
        exclude: "\\.png$|\\.ico$|\\.jpg$"
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^Dashboard/(src|tests|scripts)/.*\.py$

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.11
        files: ^Dashboard/(src|tests|scripts)/.*\.py$
